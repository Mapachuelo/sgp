services:
  db:
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_DB: sgp
      POSTGRES_USER: sgp_user
      POSTGRES_PASSWORD: sgp_password
      PGPORT: 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgp_user -d sgp -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 10
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:false

  app:
    build:
      context: .
      dockerfile: Containerfile
    network_mode: host
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://sgp_user:sgp_password@localhost:5433/sgp
      JWT_SECRET: sgp_super_secret
      JWT_EXPIRES_IN: 30m
    depends_on:
      db:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:false

volumes:
  pgdata:

volumes:
  pgdata:
