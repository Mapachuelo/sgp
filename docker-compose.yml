services:
  db:
    image: postgres:16-alpine
    container_name: sgp_db
    environment:
      POSTGRES_DB: sgp
      POSTGRES_USER: sgp_user
      POSTGRES_PASSWORD: sgp_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgp_user -d sgp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgp_app
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://sgp_user:sgp_password@db:5432/sgp
      JWT_SECRET: sgp_super_secret
      JWT_EXPIRES_IN: 30m
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
