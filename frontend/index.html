<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f1f1ee" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="SGP: citas, pagos y turnos para tu peluquería." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>SGP — Sistema de Gestión de Peluquería</title>
    <style>
      html { background: #f1f1ee; }
      html[data-theme="dark"] { background: #0f100f; }
    </style>
    <script>
      (function () {
        try {
          var preferencia = localStorage.getItem('sgp_tema') || 'sistema';
          var oscuro =
            preferencia === 'oscuro' ||
            (preferencia === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var raiz = document.documentElement;
          raiz.dataset.theme = oscuro ? 'dark' : 'light';
          raiz.style.colorScheme = oscuro ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', oscuro ? '#0f100f' : '#f1f1ee');
        } catch (error) {
          /* sin acceso a localStorage: se queda con el tema del sistema */
        }
      })();
    </script>
  </head>
  <body>
    <a href="#contenido-principal" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[100] focus:bg-superficie focus:text-texto-principal focus:px-4 focus:py-2 focus:rounded-lg focus:border focus:border-borde">
      Saltar al contenido
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
