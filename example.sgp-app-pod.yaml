apiVersion: v1
kind: Pod
metadata:
  name: sgp-app
  labels:
    app: sgp
spec:
  hostname: sgp-app
  containers:
    - name: backend
      image: localhost/sgp-backend:latest
      imagePullPolicy: IfNotPresent
      env:
        - name: DATABASE_URL
          value: postgresql://sgp_user:sgp_password@sgp-db:5432/sgp
        - name: JWT_SECRET
          value: sgp_super_secret_2026
        - name: AES_SECRET
          value: PON_AQUI_TU_SECRETO_AES
        - name: JWT_EXPIRES_IN
          value: 30m
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: development
        - name: BREVO_API_KEY
          value: PON_AQUI_TU_API_KEY
        - name: BREVO_SENDER_EMAIL
          value: pon_aqui_tu@correo.com
        - name: BREVO_SENDER_NAME
          value: SGP
        - name: WOMPI_BASE_URL
          value: https://sandbox.wompi.co/v1
        - name: WOMPI_PUBLIC_KEY
          value: pon_aqui_tu_pub_test
        - name: WOMPI_INTEGRITY_SECRET
          value: pon_aqui_tu_test_integrity
        - name: WOMPI_EVENTS_SECRET
          value: pon_aqui_tu_test_events
        - name: WOMPI_REDIRECT_URL
          value: http://localhost:8080/cliente/reservar

    - name: frontend
      image: localhost/sgp-frontend:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
          hostPort: 8080
